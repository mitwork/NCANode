[versions]
kotlin = "2.4.10"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
kotest = "6.2.4"
mockk = "1.14.11"

[libraries]
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
# Kotest 6: spring-extension вернулся в основной monorepo (io.kotest) с
# версией, выровненной с ядром; старые координаты io.kotest.extensions:...
# застряли на 1.3.0 (Kotest 5-only). Один version.ref — Dependabot бампит
# ядро и extension синхронно.
kotest-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[bundles]
kotest = ["kotest-runner", "kotest-assertions"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
