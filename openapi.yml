components:
  schemas:
    XmlVerifyRequest:
      type: object
      properties:
        revocationCheck:
          type: array
          items:
            type: string
            enum:
            - OCSP
            - CRL
          uniqueItems: true
        xml:
          type: string
          minLength: 1
      required:
      - xml
    CertificateInfo:
      type: object
      properties:
        valid:
          type: boolean
        revocations:
          type: array
          items:
            $ref: "#/components/schemas/CertificateRevocationStatus"
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        keyUsage:
          type: string
          enum:
          - UNKNOWN
          - AUTH
          - SIGN
        serialNumber:
          type: string
        signAlg:
          type: string
        keyUser:
          type: array
          items:
            type: string
            enum:
            - INDIVIDUAL
            - ORGANIZATION
            - CEO
            - CAN_SIGN
            - CAN_SIGN_FINANCIAL
            - HR
            - EMPLOYEE
            - NCA_PRIVILEGES
            - NCA_ADMIN
            - NCA_MANAGER
            - NCA_OPERATOR
            - IDENTIFICATION
            - IDENTIFICATION_CON
            - IDENTIFICATION_REMOTE
            - IDENTIFICATION_REMOTE_DIGITAL_ID
          uniqueItems: true
        publicKey:
          type: string
        signature:
          type: string
        subject:
          $ref: "#/components/schemas/CertificateSubject"
        issuer:
          $ref: "#/components/schemas/CertificateSubject"
    CertificateRevocationStatus:
      type: object
      properties:
        revoked:
          type: boolean
        by:
          type: string
          enum:
          - OCSP
          - CRL
        revocationTime:
          type: string
          format: date-time
        reason:
          type: string
        result:
