openapi: 3.1.0
info:
  title: NCANode API
  description: |-
    Server-side подпись и верификация для ЭЦП НУЦ РК (gosrk).

    Интегрируется с НУЦ-инфраструктурой: pki.gov.kz / test.pki.gov.kz
    (OCSP/TSP/CRL). Поддерживает GOST 34.10-2015 (актуальный стандарт),
    форматы CMS/CAdES-T, XMLDSIG, PAdES, WS-Security, JWT.

    Каждая операция доступна в одиночном (`/<service>/<op>`)
    и batch (`/<service>/<op>/batch`) вариантах.
  license:
    name: MIT
    url: https://github.com/malikzh/NCANode/blob/master/LICENSE
  version: v4
servers:
- url: ""
  description: current server
tags:
- name: JWT
  description: JWT encode/decode (GG2015/GG2004/ES*/RS*)
- name: PKCS12
  description: "Чтение p12-хранилищ: info и aliases"
- name: WSSE
  description: WS-Security X.509 подпись SOAP-конвертов (для SmartBridge sb.egov.kz)
- name: PAdES
  description: "Подпись и проверка PAdES (ETSI EN 319 142-1), уровни B, T, LT и LTA"
- name: PDF
  description: Подпись и верификация PDF (PAdES/CAdES-T)
- name: CAdES
  description: "Подпись и проверка CAdES (ETSI EN 319 122-1), уровни B, T, LT и LTA"
- name: CMS
  description: "PKCS#7/CMS подписи (attached/detached), addSigners, CAdES-T"
- name: X509
  description: Чтение/валидация x509-сертификатов и SBA-verify
- name: XML
  description: "XMLDSIG: подпись и верификация XML-документов"
- name: XAdES
  description: "Подпись и проверка XAdES (ETSI EN 319 132-1), уровни B, T, LT и LTA"
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
