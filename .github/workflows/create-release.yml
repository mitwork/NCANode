name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history нужна для auto-generated release notes
          # (gh берёт PR'ы между last release и текущим tag'ом).
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Kalkancrypt libraries
        id: kalkancrypt-cache
        uses: actions/cache@v6
        with:
          path: ./lib
          key: ${{ runner.os }}-kalkancrypt-libs-2
      - name: Install kalkan libraries
        if: steps.kalkancrypt-cache.outputs.cache-hit != 'true'
        env:
          KALKAN_CRYPT_URL: ${{ secrets.KALKAN_CRYPT_URL }}
          KALKAN_CRYPT_XMLDSIG_URL: ${{ secrets.KALKAN_CRYPT_XMLDSIG_URL }}
        run: |
          wget -P ./lib "$KALKAN_CRYPT_URL"
          wget -P ./lib "$KALKAN_CRYPT_XMLDSIG_URL"
      - name: Extract version from tag (strip leading `v`)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build bootJar with release version
        run: ./gradlew -Pversion=${{ steps.ver.outputs.version }} bootJar --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: NCANode-build
          path: build/libs
          if-no-files-found: error
      - name: Create release asset
        run: zip --junk-paths ./NCANode.zip build/libs/*.jar README.md LICENSE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NCANode ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            --draft \
            ./NCANode.zip
