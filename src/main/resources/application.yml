spring:
  main:
    banner-mode: off
server:
  port: ${NCANODE_PORT:14579}
ncanode:
  system:
    detailedErrors: ${NCANODE_DEBUG:false}
    cacheDir: ${NCANODE_CACHE_DIR:./cache}
    requestLog:
      enabled: ${NCANODE_REQUEST_LOG_ENABLED:true}
  crl:
    enabled: ${NCANODE_CRL_ENABLED:true}
    cacheEnabled: ${NCANODE_CRL_CACHE_ENABLED:true}
    warmupEnabled: ${NCANODE_CRL_WARMUP_ENABLED:true}
    strict: ${NCANODE_CRL_STRICT:false}
    ttl: ${NCANODE_CRL_TTL:1440}
    url: ${NCANODE_CRL_URL:http://crl.pki.gov.kz/nca_rsa_2022.crl http://crl.pki.gov.kz/nca_gost_2022.crl}
    delta:
      url: ${NCANODE_CRL_DELTA_URL:http://crl.pki.gov.kz/nca_d_rsa_2022.crl http://crl.pki.gov.kz/nca_d_gost_2022.crl}
      ttl: ${NCANODE_CRL_DELTA_TTL:60}
  http-client:
    connectTimeout: ${NCANODE_HTTP_CLIENT_CONNECT_TIMEOUT:5}
    requestTimeout: ${NCANODE_HTTP_CLIENT_REQUEST_TIMEOUT:30}
    userAgent: ${NCANODE_HTTP_CLIENT_USER_AGENT:}
    proxy:
      url: ${NCANODE_PROXY_URL:}
      username: ${NCANODE_PROXY_USERNAME:}
      password: ${NCANODE_PROXY_PASSWORD:}
  ocsp:
    url: ${NCANODE_OCSP_URL:http://ocsp.pki.gov.kz/}
    parallelEnabled: ${NCANODE_OCSP_PARALLEL:true}
    strict: ${NCANODE_OCSP_STRICT:false}
  ca:
    url: ${NCANODE_CA_URL:http://pki.gov.kz/cert/nca_rsa.crt http://pki.gov.kz/cert/nca_gost.crt http://pki.gov.kz/cert/root_gost_2022.cer http://root.gov.kz/cert/root_gost_2020.cer http://root.gov.kz/cert/root_rsa_2020.cer http://pki.gov.kz/cert/nca_gost_2022.cer http://pki.gov.kz/cert/nca_rsa_2022.cer}
    ttl: ${NCANODE_CA_TTL:1440}
    crl:
      enabled: ${NCANODE_CA_CRL_ENABLED:true}
      cacheEnabled: ${NCANODE_CRL_CACHE_ENABLED:true}
      warmupEnabled: ${NCANODE_CRL_WARMUP_ENABLED:false}
      strict: ${NCANODE_CRL_STRICT:false}
      ttl: ${NCANODE_CA_CRL_TTL:1440}
      url: ${NCANODE_CA_CRL_URL:http://crl.root.gov.kz/gost.crl http://crl.root.gov.kz/rsa.crl http://crl.root.gov.kz/gost2015_2022.crl http://crl.root.gov.kz/rsa2020.crl}
      delta:
        enabled: false
        url:
        ttl:
  tsp:
    url: ${NCANODE_TSP_URL:http://tsp.pki.gov.kz/}
    retries: ${NCANODE_TSP_RETRIES:3}
management:
  endpoints:
    web:
      exposure:
        include: ${NCANODE_ACTUATOR_ENDPOINTS:health,info,prometheus}
  endpoint:
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: ${NCANODE_PROMETHEUS_ENABLED:true}
springdoc:
  show-actuator: true
  swagger-ui:
    configUrl: ${SWAGGER_RELATIVE_PATH:}/v3/api-docs/swagger-config
    oauth2RedirectUrl: ${SWAGGER_RELATIVE_PATH:}/swagger-ui/oauth2-redirect.html
    url: ${SWAGGER_RELATIVE_PATH:}/v3/api-docs
